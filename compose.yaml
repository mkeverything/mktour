# local postgres: `bun db:up` starts and migrates the dev database, `bun db:test` the test one
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: mktour
      POSTGRES_PASSWORD: mktour
      POSTGRES_DB: mktour
    ports:
      - 127.0.0.1:5433:5432
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      # over tcp, so the socket-only server that runs init scripts doesn't count as ready
      test: pg_isready --host 127.0.0.1 --username mktour --dbname mktour
      interval: 1s
      timeout: 5s
      retries: 30

  postgres-test:
    image: postgres:18
    environment:
      POSTGRES_USER: mktour
      POSTGRES_PASSWORD: mktour
      POSTGRES_DB: mktour_test
    ports:
      - 127.0.0.1:5434:5432
    # tests reseed and re-migrate on every run, so the data lives in memory
    tmpfs: /var/lib/postgresql
    healthcheck:
      test: pg_isready --host 127.0.0.1 --username mktour --dbname mktour_test
      interval: 1s
      timeout: 5s
      retries: 30

volumes:
  postgres:
