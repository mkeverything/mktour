# local postgres for development and tests. `bun db:up` starts it and applies migrations
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: mktour
      POSTGRES_PASSWORD: mktour
      POSTGRES_DB: mktour
    ports:
      - 127.0.0.1:5433:5432
    volumes:
      - postgres:/var/lib/postgresql/data
    configs:
      - source: create-test-db
        target: /docker-entrypoint-initdb.d/create-test-db.sql
    healthcheck:
      # over tcp, so the socket-only server that runs init scripts doesn't count as ready
      test: pg_isready --host 127.0.0.1 --username mktour --dbname mktour
      interval: 1s
      timeout: 5s
      retries: 30

configs:
  create-test-db:
    content: create database mktour_test;

volumes:
  postgres:
